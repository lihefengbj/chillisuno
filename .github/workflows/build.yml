name: build

on:
  push:
    branches: [main]     # 每次推送：构建验证
    tags: ["v*"]         # 打 tag：出正式 Release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: chillisuno-windows
            package: chillisuno-windows.zip
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            artifact: chillisuno-macos-x86_64
            package: chillisuno-macos-x86_64.dmg
          - os: macos-26
            platform: macos
            arch: arm64
            artifact: chillisuno-macos-arm64
            package: chillisuno-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 注入版本号（tag 构建时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "__version__ = \"$VERSION\"" > app/version.py

      - name: 生成图标
        shell: bash
        run: python tools/make_logo.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: 生成 macOS icns
        if: matrix.platform == 'macos'
        run: |
          mkdir -p assets/icon.iconset
          for s in 16 32 128 256 512; do
            s2=$((s*2))
            sips -z $s $s assets/logo.png --out assets/icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $s2 $s2 assets/logo.png --out assets/icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm chillisuno.spec

      - name: 验证 macOS 构建架构
        if: matrix.platform == 'macos'
        run: lipo dist/chillisuno.app/Contents/MacOS/chillisuno -verify_arch ${{ matrix.arch }}

      - name: 打包 zip（Windows）
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path dist\chillisuno -DestinationPath dist\chillisuno-windows.zip

      - name: 打包 dmg（macOS）
        if: matrix.platform == 'macos'
        run: |
          cd dist
          hdiutil create -volname chillisuno-${{ matrix.arch }} -srcfolder chillisuno.app \
            -ov -format UDZO chillisuno-macos-${{ matrix.arch }}.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
