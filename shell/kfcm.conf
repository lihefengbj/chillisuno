log_format kfcm_timing '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'request_time=$request_time '
                        'upstream_connect_time=$upstream_connect_time '
                        'upstream_header_time=$upstream_header_time '
                        'upstream_response_time=$upstream_response_time '
                        'upstream_addr=$upstream_addr';

	server {
        listen       80;
        server_name  hscmai2.erp.sina.com.cn;

        #charset koi8-r;
		root   "/data0/www/kfcm_server";
        access_log  /data0/www/kfcm_server/logs/host.access.log  main;
        access_log  /data0/www/kfcm_server/logs/host.timing.access.log kfcm_timing;
        #root    /home/wwwroot/default;
        location / {
		#alias    "D:/myphp_www/PHPTutorial/server";
           index  index.html index.htm server/index.php l.php;
           autoindex  off;
		   rewrite ^/(.*)/$ /$1 redirect;

			if (!-e $request_filename){
				rewrite ^(.*)$ /index.php last;
			}

			# 若访问根目录，重定向至初始页面
			rewrite / /index.html redirect;
        }

		location ~* \.html$ {
        # 两种写法
        #root "${path_www}/server/view";
        if (!-e $request_filename){
          rewrite ^(.*)$ /view/$1 last;
        }
    }

    # set expiration of assets to MAX for caching
    location ~* \.(ico|css|js|gif|jpe?g|png)(\?[0-9]+)?$ {
        #root "${path_www}/server/view";
        if (!-e $request_filename){
          rewrite ^(.*)$ /view/$1 last;
        }
        expires max;
        log_not_found off;
    }

    location ~* \.(eot|otf|ttf|woff|woff2)$ {
        #root "${path_www}/server/view";
        if (!-e $request_filename){
          rewrite ^(.*)$ /view/$1 last;
        }
        add_header Access-Control-Allow-Origin *;
    }
        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
         location ~ \.php(.*)$  {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO  $fastcgi_path_info;
            fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
            include        fastcgi_params;
    }
				 location ^~ /apis/ {
			add_header Access-Control-Allow-Origin '*';
			proxy_pass http://10.185.9.73:8088/;
			proxy_connect_timeout 300s;
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
} 

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
